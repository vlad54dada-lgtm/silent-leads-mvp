# Приклад конфігурації Silent Leads Retouch MVP. Скопіюйте в config.yaml і за потреби змініть.
# Секретів тут немає і бути не повинно — інструмент працює офлайн.

# Які правила застосовувати.
# v2 — «Кому пишемо» (друга частина спринту): AI читає діалог і визначає останню позицію клієнта щодо
#   проєкту (кроки 1-3: чиї слова рахуються, жорсткий стоп, остання позиція), код застосовує крок 4
#   (прихована розмова після цієї позиції → need_human), строк 7 днів і новий контакт після silent.
#   Без AI код вирішує лише точний STOP і кейси, де клієнт нічого не писав; решта → manual_review.
# v1 — правила першої частини спринту (точний STOP, тригери ручної перевірки, AI-перевірка відмови).
policy: v2

# Строк першого повторного касання в КАЛЕНДАРНИХ днях після переходу в silent.
# 7 — тестове припущення зі спринту, НЕ затверджений регламент продажів.
first_touch_delay_days: 7

# Часовий пояс CRM. Усі дати у вигрузці — локальний час CRM; порівняння ведеться в цій зоні.
crm_timezone: America/Los_Angeles

# Момент знімка вигрузки. null → береться з вкладки «Інструкція», рядок «Знімок UTC».
# Задайте явно (ISO 8601 з зоною), якщо у файлі цього рядка немає.
snapshot_utc: null

# Назви вкладок у файлі вигрузки.
sheets:
  leads: Ліди
  messages: Повідомлення
  instruction: Інструкція
  control: Контроль
  # v2: еталонні мітки для команди evaluate-policy-labels (вкладки необов'язкові).
  labels: Розмітка
  examples: Приклади

# Шаблони повідомлень. Затверджених шаблонів замовник не надав, тому за замовчуванням
# текст порожній, а статус template_missing. Для демонстрації можна вписати текст і
# поставити status: test_template — він ніколи не позначається як затверджений.
# Заборонено вигадувати знижки, ціни, дати та будь-які комерційні обіцянки.
templates:
  with_quote:
    text: ""
    status: template_missing
  without_quote:
    text: ""
    status: template_missing

# v2: детермінована частина політики — крок 4. Кейс іде людині (need_human), лише якщо ПІСЛЯ останньої
# позиції клієнта є прихована розмова або дзвінок, що відбувся, без транскрипту. Привітання голосової
# пошти, контакти, службові повідомлення, HANGUP/VM без тексту — не причина.
contact_policy:
  # Значення hidden_kind, за якими може ховатися відмова.
  risky_hidden_kinds: [conversation]
  # Прихована подія без hidden_kind вважається ризиковою розмовою (невідомо = ризик).
  unknown_hidden_kind_is_risky: true
  # call_result, що означає «розмова відбулась»; такий дзвінок без транскрипту — ризик.
  connected_call_results: [SUCCESS]
  # Новий контакт після silent. null — буквально за ТЗ: БУДЬ-ЯКА подія після silent_since_crm відправляє
  # contact_ok на manual_review. Число N звужує правило: спроба продавця без відповіді в межах N годин
  # від позначки silent — це остання спроба, з якою лід і перейшов у silent, а не новий контакт.
  # На ручній перевірці лишаються: подія з боку клієнта, остання позиція клієнта вже після silent,
  # дія продавця пізніше ніж через N годин (повторне касання вже зробили вручну).
  # У вигрузці v2 це знімає 24 із 26 таких кейсів (docs/limitations.md). Змінювати після погодження.
  sales_followup_grace_hours: null

# v2: чернетки SMS від AI для contact_candidate — продовження саме цього діалогу з урахуванням позиції
# клієнта (ціна / відкладає чи порівнює / просто замовк). Це підказка сейлзу, НЕ затверджений шаблон:
# колонки draft_sms / template_status у «Результат» і далі йдуть за templates. Чернетки — в аркуші
# «Чернетки SMS» і drafts.csv; SMS надсилає сейлз після перевірки. Потрібен увімкнений ai_review.
# Код відхиляє чернетку (статус ai_draft_rejected), якщо в ній є будь-який збіг із forbidden_patterns:
# цифри (ціни, знижки, дати, телефони), $, %, посилання, email, маскування на кшталт [ІМʼЯ].
drafts:
  enabled: false
  max_chars: 320
  # Скільки символів КІНЦЯ діалогу бачить модель, коли пише чернетку: для продовження розмови потрібен
  # останній контекст, а не вся історія (дешевше в кілька разів).
  context_chars: 6000
  forbidden_patterns: ['\d', '\$', '%', 'https?://', 'www\.', '\[', '\]', '@']

# Текстові правила та підказки (без урахування регістру).
# exact_opt_out діє в обох політиках; hints і review: нижче — лише для v1.
# exact_opt_out — ЄДИНЕ правило по тексту: якщо ВСЕ повідомлення клієнта — одне з цих слів (офіційна
#   відписка в США: STOP / UNSUBSCRIBE), кейс → do_not_contact незалежно від строку та контексту.
#   «STOP» усередині фрази («stop by», «Reply STOP to opt out») правилом НЕ є — це контекст.
# hints — НЕ правило, а підказки: фраза в репліці клієнта або з невизначеним автором означає, що контекст
#   треба оцінити. З увімкненим AI-аналізом вирішує модель; без нього кейс іде на manual_review.
# Розширюйте списки після перегляду реальних кейсів; кожна зміна — у docs/review-log.md.
phrases:
  exact_opt_out:
    - "stop"
    - "unsubscribe"
  hints:
    - "stop"
    - "unsubscribe"
    - "don't text"
    - "dont text"
    - "do not text"
    - "don't call"
    - "dont call"
    - "do not call"
    - "don't contact"
    - "do not contact"
    - "don't message"
    - "do not message"
    - "stop texting"
    - "stop calling"
    - "stop contacting"
    - "remove me"
    - "take me off"
    - "leave me alone"
    - "no more messages"
    - "no more calls"
    - "not interested"
    - "no longer interested"
    - "wrong number"
    - "never contacted you"
    - "already hired someone"
    - "went with someone else"
    - "went with another"
    - "found someone else"
    - "no longer need"
    - "don't need"
    - "cancel"

# Що відправляє кейс на ручну перевірку (manual_review). Усе за замовчуванням увімкнено —
# вимикайте лише після погодження з координатором.
review:
  # Будь-яка подія (клієнта або сейлза) ПІСЛЯ silent_since_crm.
  contact_after_silent: true
  # Вхідне повідомлення клієнта з прихованим текстом (withheld_hidden): контекст неповний.
  hidden_inbound: true
  # Від клієнта немає жодного тексту (ні SMS, ні транскрипту): відсутній контекст ≠ дозвіл.
  no_client_text: true
  # Фраза-підказка (phrases.hints) у репліці клієнта або з невизначеним автором: без AI-аналізу → ручна
  # перевірка; з AI-аналізом контекст оцінює модель, підказка лише фіксується в примітці.
  phrase_hint: true
  # Вхідна подія клієнта без читабельного тексту, не позначена як прихована (дзвінок без транскрипту,
  # порожній текст, невідомий content_state): клієнт щось сказав, а ми не знаємо що. Найбільший вплив
  # на кількість ручних перевірок (16 кейсів у контрольній вигрузці) — вимикати лише з координатором.
  inbound_without_text: true
  # Репліка транскрипту без маркера (C)/(S) або весь транскрипт без маркерів: не відрізнити клієнта
  # від сейлза, тож позитивне рішення без людини неможливе (3 кейси у контрольній вигрузці).
  unknown_speaker: true

# AI-аналіз контексту діалогу (Claude). Погоджено координатором 2026-11-09 — див. docs/limitations.md.
# v2: модель оцінює кроки 1-3 «Кому пишемо» для кожного кейсу, де є слова клієнта (крім точного STOP без
# продовження) і повертає мітку contact_ok / do_not_contact / need_human, причину, впевненість, докази та
# message_id останньої позиції клієнта. Кандидат можливий лише при contact_ok з високою впевненістю; відмова
# блокує лише з високою впевненістю і доказом; усе інше → manual_review. Опис нижче стосується v1.
# Викликається для КОЖНОГО кейсу з читабельним текстом клієнта, крім кейсів з точним STOP/UNSUBSCRIBE.
# Моделі передається діалог кейсу: репліки клієнта І сейлза в порядку часу з message_id і автором,
# приховані повідомлення позначені як hidden; імена, дати, квоти, псевдоніми — ні.
# Відповідь: мітка none/opt_out/negative/unclear + впевненість + докази. opt_out/negative з високою
# впевненістю і доказом → do_not_contact; none з високою впевненістю → кейс іде далі за строком;
# усе інше → manual_review. Модель ніколи не робить кейс кандидатом сама. enabled: false → офлайн.
# Ключ API береться зі змінної середовища, назва якої вказана в api_key_env; сам ключ у конфіг не писати.
ai_review:
  enabled: false
  # Sonnet 5.5 — рекомендований баланс: ті самі мітки, що й Opus, удвічі дешевше і менше ручних перевірок,
  # ніж Haiku (порівняння 2026-11-09 у docs/limitations.md). Haiku 5.5 — у 20 разів дешевше, більше manual_review.
  model: claude-sonnet-5-5
  # Максимум символів діалогу, що надсилаються за один кейс; довше — обрізаються найстаріші репліки з позначкою.
  max_input_chars: 40000
  # Куди звертатися. null — напряму в Anthropic (api.anthropic.com), ключ у ANTHROPIC_API_KEY.
  # Через OpenRouter (Anthropic-сумісний шлюз; окреме погодження — дані бачить ще один посередник):
  #   base_url: https://openrouter.ai/api
  #   api_key_env: OPENROUTER_API_KEY
  #   model: anthropic/claude-sonnet-5.5   # назва як на openrouter.ai/models
  base_url: null
  api_key_env: ANTHROPIC_API_KEY
  # v2: папка-кеш відповідей моделі. Ключ кешу = модель + промпт + діалог, тож повторний прогін питає
  # модель лише про те, що змінилось, не платить двічі і дає той самий результат. Обірваний прогін
  # (закінчились кошти, мережа) продовжується з того ж місця. У кеші — висновки про реальні діалоги,
  # тому папка має лежати в data/ (не комітиться). null — без кешу; щоб перепитати модель, видаліть папку.
  cache_dir: data/ai_cache
